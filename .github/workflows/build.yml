name: Build branded apps and verify native Mac bundles
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.9'
          cache-dependency-path: source-code-windows/go.sum
      - run: go test -tags ci ./... && bash packaging/build-windows.sh
        working-directory: source-code-windows
        env: {CGO_ENABLED: '1', CC: gcc}
      - name: Verify embedded Windows icons and version resources
        run: |
          python -m pip install pefile
          python tools/check-windows-icons.py source-code-windows/out
      - uses: actions/upload-artifact@v7
        with:
          name: GeoCheats-Windows
          path: source-code-windows/out/*
  macos:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.9'
          cache-dependency-path: source-code-macos/go.sum
      - run: go test -tags ci ./...
        working-directory: source-code-macos
        env: {CGO_ENABLED: '1'}
      - name: Build, sign, launch, archive and verify Mac apps and DMG
        run: bash packaging/build-macos.sh
        working-directory: source-code-macos
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v7
        with:
          name: GeoCheats-macOS
          path: source-code-macos/out/GeoCheats-macOS.zip
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          path: source-code-macos/out/GeoCheats-macOS.dmg
          archive: false
  macos-arm64-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.9'
          cache-dependency-path: source-code-macos/go.sum
      - run: go test -tags ci ./... && bash packaging/build-macos.sh
        working-directory: source-code-macos
        env: {CGO_ENABLED: '1'}
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.9'
          cache-dependency-path: source-code-linux/go.sum
      - run: sudo apt-get update && sudo apt-get install -y rpm desktop-file-utils pkg-config libgl1-mesa-dev libegl1-mesa-dev libwayland-dev libdecor-0-dev xorg-dev libxkbcommon-dev xvfb xauth zenity
      - name: Test and build Linux apps
        run: |
          go test -tags ci ./...
          go build -trimpath -ldflags='-s -w' -o GeoCheats ./cmd/geocheats
          go build -trimpath -ldflags='-s -w' -o Dash ./cmd/dash-desktop
          xvfb-run -a python3 ../tools/check-native-linux.py
          desktop-file-validate packaging/geocheats.desktop packaging/dash.desktop
          bash packaging/build-linux.sh
          python3 ../tools/check-linux-packages.py packages
        working-directory: source-code-linux
        env: {CGO_ENABLED: '1'}
      - uses: actions/upload-artifact@v7
        with: {name: GeoCheats-Linux, path: source-code-linux/GeoCheats-Linux.zip}
